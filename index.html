<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream En Vivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background-color: #0e0e10; color: #efeff1; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    
    /* Contenedor del Video (VDO.ninja capturando la transmisión) */
    #player-container { flex: 1; background: #000; }
    
    /* Contenedor del Chat Oficial de Twitch */
    #chat-container { width: 340px; height: 100vh; background: #18181b; border-left: 1px solid #2f2f35; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- 1. REPRODUCTOR DE VIDEO (Reemplaza la URL con la de VDO.ninja) -->
  <div id="player-container">
    <iframe 
      src="https://vdo.ninja/?view=CFa2xsk" 
      allow="autoplay; camera; microphone">
    </iframe>
  </div>

  <!-- 2. CHAT OFICIAL DE TWITCH -->
  <div id="chat-container">
    <iframe 
      src="https://www.twitch.tv/embed/TU_CANAL_DE_TWITCH/chat?parent=TU_USUARIO.github.io&darkpopout">
    </iframe>
  </div>

</body>
</html>
